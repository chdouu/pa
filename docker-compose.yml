services:
  pa-server:
    build: .
    restart: unless-stopped
    environment:
      PA_API_TOKEN: ${PA_API_TOKEN:?set PA_API_TOKEN in .env}
      PA_AI_API_KEY: ${PA_AI_API_KEY:?set PA_AI_API_KEY in .env}
      PA_FEISHU_WEBHOOK_URL: ${PA_FEISHU_WEBHOOK_URL:-}
      PA_FEISHU_SECRET: ${PA_FEISHU_SECRET:-}
      PA_FEISHU_APP_ID: ${PA_FEISHU_APP_ID:-}
      PA_FEISHU_APP_SECRET: ${PA_FEISHU_APP_SECRET:-}
      PA_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
      PA_BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./config/settings.json:/app/config/settings.json:ro
      - ./data:/app/data
      - ./records:/app/records
      - ./logs:/app/logs
