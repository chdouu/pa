[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-server"
version = "0.1.0"
description = "Headless continuous Price Action analysis service"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "openai>=1.40",
  "numpy>=1.26",
  "pandas>=2.2",
  "tzlocal>=5,<6",
  "tiktoken>=0.7",
  "jsonschema>=4.22",
  "cryptography>=42",
  "requests>=2.32",
  "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pa-server = "pa_server.api:main"

[tool.setuptools.packages.find]
include = ["pa_server*", "pa_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
